name: Preview screenshots

on:
  push:
    branches:
      - arena/b786de41-bubbletruckwindowcleaning-com
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm i playwright@1.49.0 --no-save --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Capture screenshots
        run: node qa/shots.mjs
      - name: Publish screenshots to the branch
        run: |
          git config user.name "screenshot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f qa/shots
          git diff --cached --quiet || git commit -m "QA screenshots [skip ci]"
          git push
